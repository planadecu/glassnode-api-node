name: Publish Package
# Releases the `version` already in package.json (every change bumps it, see CLAUDE.md
# "Versioning"). CI never bumps the version and never commits or pushes to `main`, which is
# protected (PRs only). Flow on a merge to main:
#   verify   the full CI check list (ci.yml, called as a reusable workflow), no special rights
#   release  read-only: is package.json's version already on npm? (scripts/release-state.sh)
#   publish  waits for approval in the `npm` environment, then publishes via npm Trusted
#            Publishing (OIDC, with provenance), pushes the `v<version>` tag and creates the
#            GitHub Release from the CHANGELOG section
# A merge that does not bump `version`, or a re-run after a successful release, skips the
# publish (and the approval) with a notice in the job summary.
on:
  push:
    branches:
      - main

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      action: ${{ steps.state.outputs.action }}
      version: ${{ steps.state.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Fails the job (rather than publishing) if npm cannot be queried; only a 404 means
      # "not published".
      - id: state
        run: scripts/release-state.sh

  publish:
    needs: [verify, release]
    if: needs.release.outputs.action != 'skip'
    runs-on: ubuntu-latest
    # Required reviewer (the maintainer) and a `main`-only deployment branch rule are configured
    # on this environment, and the npm Trusted Publisher is bound to it: nothing publishes
    # without an approval.
    environment: npm
    # One release at a time: an in-progress publish is never cancelled, a newer run's publish job
    # waits for it.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: write # push the v<version> tag and create the GitHub Release
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
        env:
          # The repo .npmrc sets ignore-scripts=true (supply-chain hardening), but the
          # standalone pnpm (@pnpm/exe) needs its preinstall (setup.js picks the platform
          # binary) or the pnpm bin is a stub that fails with "This: not found". Re-enable
          # scripts for this bootstrap only; the project installs below still honor .npmrc.
          npm_config_ignore_scripts: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # registry-url is required so npm knows the registry for the OIDC exchange.
          # npm CLI (>= 11.5.1) detects the OIDC environment and authenticates with it
          # BEFORE falling back to the setup-node placeholder token, so no NODE_AUTH_TOKEN
          # is set on the publish step. (pnpm publish does NOT do this — it uses the
          # placeholder and 404s — which is why we publish with npm below.)
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      # setup-node's registry-url writes an .npmrc with `always-auth=true` and a placeholder
      # `_authToken`, which forces npm to send the fake token instead of doing the OIDC
      # exchange (→ E404). Overwrite it with just the registry so npm has no token and must
      # authenticate via OIDC trusted publishing.
      - name: Clean npmrc so npm uses OIDC (not the placeholder token)
        run: printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
      # npm >= 11.5.1 performs the OIDC exchange.
      - run: npm install -g npm@latest
      - run: npm --version
      # Re-check right before publishing: the approval may have waited while another run
      # published this version.
      - id: state
        run: scripts/release-state.sh
      - if: steps.state.outputs.action == 'publish'
        run: pnpm install --frozen-lockfile
      # The repo .npmrc (ignore-scripts=true) also stops npm running prepublishOnly, so build
      # explicitly.
      - if: steps.state.outputs.action == 'publish'
        run: pnpm run build
      - if: steps.state.outputs.action == 'publish'
        run: pnpm run build:browser
      # Publish via npm Trusted Publishing (OIDC). npm exchanges the GitHub id-token
      # (permissions.id-token: write) for a short-lived publish credential and attaches
      # provenance (publishConfig.provenance). Requires a Trusted Publisher configured for this
      # package on npmjs.com: repo glassnode/glassnode-api-ts-client, workflow publish.yml,
      # environment npm.
      - if: steps.state.outputs.action == 'publish'
        run: npm publish
      - if: steps.state.outputs.action == 'publish'
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: echo "Published \`glassnode-api@$VERSION\` to npm." >> "$GITHUB_STEP_SUMMARY"
      # Tag the published commit. An existing tag on this commit is fine (re-run); one on another
      # commit is left alone with a warning, and the GitHub Release is then skipped.
      - name: Push the v<version> tag
        id: tag
        if: steps.state.outputs.action == 'publish' || steps.state.outputs.action == 'tag-only'
        env:
          TAG: ${{ steps.state.outputs.tag }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null
          rc=$?
          set -e
          if [ "$rc" = 0 ]; then
            git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
            existing=$(git rev-parse "$TAG^{commit}")
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "Tag \`$TAG\` already exists on this commit." >> "$GITHUB_STEP_SUMMARY"
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Tag $TAG already exists on $existing, not on the published commit $GITHUB_SHA. Left unchanged; GitHub Release skipped."
              echo "Tag \`$TAG\` already points at \`$existing\`, not \`$GITHUB_SHA\`: left unchanged, GitHub Release skipped." >> "$GITHUB_STEP_SUMMARY"
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$rc" = 2 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "glassnode-api $VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "Pushed tag \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::git ls-remote failed (exit $rc) while checking for tag $TAG"
            exit 1
          fi
      # The release notes are the package.json version's section of CHANGELOG.md (from its
      # `## <version>` heading to the next `## ` heading).
      - name: Create the GitHub Release
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.state.outputs.tag }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2> view.err; then
            echo "GitHub Release \`$TAG\` already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -q 'release not found' view.err; then
            cat view.err
            exit 1
          fi
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::CHANGELOG.md has no '## $VERSION' section; the release links to it instead."
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md)." > notes.md
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          echo "Created GitHub Release \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
