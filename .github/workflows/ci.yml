name: CI
on:
  pull_request:
    branches: [main]

# Cancel superseded runs for the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
        env:
          # The repo .npmrc sets ignore-scripts=true (supply-chain hardening), but the
          # standalone pnpm (@pnpm/exe) needs its preinstall (setup.js picks the platform
          # binary) or the pnpm bin is a stub that fails with "This: not found". Re-enable
          # scripts for this bootstrap only; the project installs below still honor .npmrc.
          npm_config_ignore_scripts: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # Enforce the coverage thresholds (vitest.config.ts), not just that tests pass.
      - run: pnpm run test:coverage
      # Type-check the test files (Vitest transpiles without type checking).
      - run: pnpm exec tsc -p tsconfig.test.json --noEmit
      - run: pnpm run build
      - run: pnpm run build:browser
      # Deep type-resolution guard that attw can't provide (it runs with skipLibCheck on): a
      # node16 consumer importing `glassnode-api/x402` with skipLibCheck:false. Catches a public
      # `.d.ts` accidentally re-importing an optional peer's types (e.g. viem → TS1541).
      - run: pnpm exec tsc -p typecheck/x402-node16/tsconfig.json
      # Packaging audits (hard gates): the export map, types resolution and module formats must
      # stay correct across node10/node16/bundler. publint fails on errors; attw fails on any 💀/🎭/🚭.
      - run: pnpm dlx publint
      - run: pnpm dlx @arethetypeswrong/cli --pack .

  # Prove the package's advertised floor (engines: ">=18"). Vitest 5 needs Node >=22.12, so this
  # job does not run the suite — it builds and smoke-imports the CJS entry on Node 18.
  compat-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
        env:
          npm_config_ignore_scripts: 'false'
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node -e "const m = require('./dist/index.js'); if (typeof m.GlassnodeAPI !== 'function') throw new Error('CJS entry did not export GlassnodeAPI'); console.log('CJS require smoke ok on', process.version);"
